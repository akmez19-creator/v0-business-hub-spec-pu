<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      color: #fff;
    }
    .header {
      background: linear-gradient(135deg, #f97316, #ea580c);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }
    .header-title { flex: 1; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header .sub { font-size: 11px; opacity: 0.8; margin-top: 2px; }
    .content { padding: 20px; }
    
    /* Logged in state */
    .logged-in { text-align: center; }
    .user-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      margin: 0 auto 16px;
    }
    .user-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .user-email { font-size: 12px; color: #888; margin-bottom: 20px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 12px;
      color: #10b981;
      margin-bottom: 20px;
    }
    .status-badge .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .info-text {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
    }
    .info-text strong { color: #f97316; }
    .logout-btn {
      width: 100%;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #ef4444;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .logout-btn:hover { background: rgba(239, 68, 68, 0.2); }
    
    /* Login form */
    .login-form { }
    .login-title { 
      font-size: 18px; 
      font-weight: 600; 
      text-align: center; 
      margin-bottom: 20px; 
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.15s;
    }
    .form-group input:focus {
      border-color: #f97316;
      background: rgba(249, 115, 22, 0.05);
    }
    .form-group input::placeholder { color: #555; }
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 6px;
      transition: all 0.15s;
    }
    .login-btn:hover { opacity: 0.9; transform: scale(1.02); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      padding: 10px;
      color: #fca5a5;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
    }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">A</div>
    <div class="header-title">
      <h1>Akmez Quick Order</h1>
      <div class="sub">Account Settings</div>
    </div>
  </div>
  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
